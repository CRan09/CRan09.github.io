<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <title>废墟庭院试手</title>
    <script type="module" crossorigin src="./assets/index-DVcz0hlV.js"></script>
    <style>
:root{color-scheme:dark;--ink: #12141a;--paper: #f4efe4;--muted: #c9c0b2;--cinnabar: #c4483a;--gold: #e4c27a;--line: rgba(244, 239, 228, .16);--panel: rgba(16, 18, 24, .82);font-family:WenQuanYi Micro Hei,Droid Sans Fallback,Noto Sans SC,PingFang SC,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1a140f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}body{min-height:100dvh}#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#1a140f}#view{position:absolute;z-index:0;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:#1a140f}.hud,.overlay,.pad{position:absolute;z-index:2}.hud{top:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none;color:var(--paper);text-shadow:0 1px 0 #000}.who{display:flex;flex-direction:column;gap:3px;min-width:0}.who strong{font-size:15px;letter-spacing:.04em}.who span,.wave{font-size:12px;color:var(--muted)}#yard-note{font-size:11px;max-width:46vw;line-height:1.35}.hp{width:min(220px,36vw);height:8px;background:#2a241f;border:1px solid var(--line)}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e07a3d,#d24b3c)}.wave{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}#guard-readout{color:var(--gold);font-size:14px;letter-spacing:.06em}.switch-slot{position:absolute;z-index:3;top:calc(8px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));pointer-events:auto}#switch-hero:disabled,#switch-hero.is-busy{opacity:.55}#switch-hero{position:relative;z-index:1;pointer-events:auto;touch-action:manipulation;font-family:inherit;border:1px solid var(--gold);background:#101218b8;color:var(--paper);padding:6px 10px;letter-spacing:.08em;font-size:13px}.pad{inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));pointer-events:none;background:none}.cluster{display:flex;gap:8px;pointer-events:none}.pad button{pointer-events:auto;touch-action:none;width:68px;height:58px;border-radius:8px;border:1px solid rgba(244,239,228,.45);background:#0c0a0861;color:var(--paper);font-family:inherit;font-size:14px;letter-spacing:.08em;text-shadow:0 1px 0 #000}.pad button.attack{width:76px;border-color:var(--gold);background:#c4483ab8;font-size:13px}.pad button.held{background:#f4efe4b8;color:#1a140f;text-shadow:none}.pad button.attack.held{background:#e26658;color:var(--paper)}.overlay{top:0;right:0;bottom:0;left:0;display:flex;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));background:#0c0e1273;color:var(--paper)}.panel{margin:auto;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:22px 20px;text-align:center}.panel h2{margin:0 0 8px;letter-spacing:.16em}.panel p{margin:0 0 16px;color:var(--muted)}.panel .row{display:flex;gap:8px;justify-content:center}.panel button{font-family:inherit;border:0;background:var(--cinnabar);color:var(--paper);padding:10px 18px;letter-spacing:.14em;font-size:15px}.portrait{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:none;align-items:center;justify-content:center;background:#101218;color:var(--paper);text-align:center;padding:24px}.portrait h2{letter-spacing:.2em;font-weight:600}.portrait p{color:var(--muted)}@media(orientation:portrait){.portrait{display:flex}}.status{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--paper);background:#12141a;z-index:4}.hidden{display:none!important}@media(max-height:420px){.pad button{width:60px;height:48px;font-size:13px}#yard-note{display:none}.who strong{font-size:13px}}
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="status" class="status">正在铺开庭院…</div>
      <div id="hud" class="hud hidden">
        <div class="who">
          <strong id="hero-name">白锋</strong>
          <div class="hp" aria-label="生命"><i id="hp-fill"></i></div>
          <span id="hp-text">100 / 100</span>
          <span id="yard-note">W跳跃 S格挡 A向左 D向右 J普攻。单屏概念图，不是已拆关卡。右边两人是临时目标。</span>
        </div>
        <div class="wave">
          <div id="guard-readout">格挡可用</div>
        </div>
      </div>
      <div id="switch-slot" class="switch-slot">
        <button id="switch-hero" type="button">正在载入赤练…</button>
      </div>
      <section id="result" class="overlay hidden">
        <div class="panel">
          <h2 id="result-title">倒在庭院里</h2>
          <p id="result-copy">这一局清掉了。再进来仍是同一张概念图。</p>
          <div class="row">
            <button id="retry" type="button">再试一次</button>
          </div>
        </div>
      </section>
      <div id="pad" class="pad">
        <div class="cluster">
          <button type="button" data-code="KeyA">左</button>
          <button type="button" data-code="KeyD">右</button>
        </div>
        <div class="cluster">
          <button type="button" data-code="KeyW">跳跃</button>
          <button type="button" data-code="KeyS">格挡</button>
          <button type="button" data-code="KeyJ" class="attack">J普攻</button>
        </div>
      </div>
      <div id="portrait" class="portrait">
        <div>
          <h2>请转到横屏</h2>
          <p>左和右在左侧，跳跃、格挡、普攻在右侧。</p>
        </div>
      </div>
    </div>
  </body>
</html>

ct-stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;image-rendering:pixelated}.select-bg{position:absolute;left:0;top:0;width:1280px;height:720px;image-rendering:pixelated;pointer-events:none}.select-title{position:absolute;left:530px;top:28px;width:701px;margin:0;text-align:center;color:var(--paper);font-size:34px;font-weight:600;letter-spacing:.14em}.select-preview{position:absolute;left:48px;top:90px;width:452px;height:530px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:2px solid rgba(244,239,228,.28);border-radius:16px;background:#101218b8}.select-preview img{height:400px;width:auto;image-rendering:pixelated}#select-name{margin:10px 0 16px;color:var(--gold);font-size:22px;letter-spacing:.08em}.slot{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:6px 6px 8px;border:1px solid rgba(244,239,228,.28);border-radius:12px;background:#1012188c;color:var(--gold);font-family:inherit;font-size:16px;letter-spacing:.06em;touch-action:manipulation}.slot img{width:auto;height:auto;max-width:100%;max-height:calc(100% - 24px);image-rendering:pixelated;pointer-events:none}.slot.is-selected{border:2px solid #e4c27a}.slot[data-hero=male_sword]{left:530px;top:100px;width:223px;height:222px}.slot[data-hero=male_brawler]{left:769px;top:100px;width:223px;height:222px}.slot[data-hero=male_mage]{left:1008px;top:100px;width:223px;height:222px}.slot[data-hero=female_sword]{left:530px;top:338px;width:223px;height:222px}.slot[data-hero=female_brawler]{left:769px;top:338px;width:223px;height:222px}.slot[data-hero=female_mage]{left:1008px;top:338px;width:223px;height:222px}#select-start{position:absolute;left:771px;top:590px;width:220px;height:56px;border:0;border-radius:6px;background:var(--cinnabar);color:var(--paper);font-family:inherit;font-size:22px;letter-spacing:.2em;touch-action:manipulation}.portrait{position:absolute;top:0;right:0;bottom:0;left:0;z-index:6;display:none;align-items:center;justify-content:center;background:#101218;color:var(--paper);text-align:center;padding:24px}.portrait h2{letter-spacing:.2em;font-weight:600}.portrait p{color:var(--muted)}@media(orientation:portrait){.portrait{display:flex}}.status{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--paper);background:#12141a;z-index:5}.hidden{display:none!important}@media(max-height:420px){.pad button{width:60px;height:48px;font-size:13px}#yard-note{display:none}.who strong{font-size:13px}}

  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="status" class="status">正在铺开庭院…</div>
      <div id="hud" class="hud hidden">
        <div class="who">
          <strong id="hero-name">男剑士</strong>
          <div class="hp" aria-label="生命"><i id="hp-fill"></i></div>
          <span id="hp-text">100 / 100</span>
          <span id="yard-note">W跳跃 S格挡 A向左 D向右 J普攻。进院后可在六人里换。魔法师格挡是能量盾。右边两人是临时目标。</span>
        </div>
        <div class="wave">
          <div id="guard-readout">格挡可用</div>
        </div>
      </div>
      <div id="switch-slot" class="switch-slot hidden">
        <button id="switch-hero" type="button">正在载入男格斗家…</button>
        <button id="yard-reselect" type="button">选角色</button>
      </div>
      <section id="result" class="overlay hidden">
        <div class="panel">
          <h2 id="result-title">倒在庭院里</h2>
          <p id="result-copy">这一局清掉了。再进来仍是同一张概念图。</p>
          <div class="row">
            <button id="retry" type="button">再试一次</button>
            <button id="reselect" class="ghost" type="button">选角色</button>
          </div>
        </div>
      </section>
      <div id="pad" class="pad hidden">
        <div class="cluster">
          <button type="button" data-code="KeyA">左</button>
          <button type="button" data-code="KeyD">右</button>
        </div>
        <div class="cluster">
          <button type="button" data-code="KeyW">跳跃</button>
          <button type="button" data-code="KeyS">格挡</button>
          <button type="button" data-code="KeyJ" class="attack">J普攻</button>
        </div>
      </div>
      <section id="select" class="select">
        <div id="select-stage" class="select-stage">
          <img class="select-bg" alt="" src="./select/ui/bg_dim.png" />
          <h1 class="select-title">选择角色</h1>
          <div class="select-preview">
            <img id="select-portrait" alt="男剑士" src="./select/portraits/male_sword.png" />
            <span id="select-name">男剑士</span>
          </div>
          <button type="button" class="slot is-selected" data-hero="male_sword">
            <img alt="" src="./select/portraits/male_sword_bust.png" />
            <span>男剑士</span>
          </button>
          <button type="button" class="slot" data-hero="male_brawler">
            <img alt="" src="./select/portraits/male_brawler_bust.png" />
            <span>男格斗家</span>
          </button>
          <button type="button" class="slot" data-hero="male_mage">
            <img alt="" src="./select/portraits/male_mage_bust.png" />
            <span>男魔法师</span>
          </button>
          <button type="button" class="slot" data-hero="female_sword">
            <img alt="" src="./select/portraits/female_sword_bust.png" />
            <span>女剑士</span>
          </button>
          <button type="button" class="slot" data-hero="female_brawler">
            <img alt="" src="./select/portraits/female_brawler_bust.png" />
            <span>女格斗家</span>
          </button>
          <button type="button" class="slot" data-hero="female_mage">
            <img alt="" src="./select/portraits/female_mage_bust.png" />
            <span>女魔法师</span>
          </button>
          <button id="select-start" type="button">开始</button>
        </div>
      </section>
      <div id="portrait" class="portrait">
        <div>
          <h2>请转到横屏</h2>
          <p>左和右在左侧，跳跃、格挡、普攻在右侧。</p>
        </div>
      </div>
    </div>
  </body>
</html>
